    <span><i class="dot n"></i>nuove</span>

    <span style="color:#FFB84D">■ con un paletto</span>
    <span style="color:#8B93A5">■ limite tecnico</span>
  </div>
</header>

<div class="filters">
  <button class="f on" data-f="all">Tutte</button>

  <button class="f" data-f="sel">Solo scelte</button>
  <button class="f" data-f="warn">Solo con avvertenza</button>
</div>

<main id="app"></main>

<div class="out hid" id="outbox">
  <textarea id="out" readonly></textarea>
</div>

<div class="bar">
  <div class="count"><b id="c">0</b> scelte</div>
  <button class="ghost" id="clear">Azzera</button>
  <button class="act" id="copy">Copia i numeri</button>
</div>

const sel = new Set(SCELTE);
const app = document.getElementById('app');

DATA.forEach(sec=>{
  const s = document.createElement('section');
  s.innerHTML = `<h2>${sec.h}</h2><p class="stitle">${sec.s}</p>`;
  sec.i.forEach(([n,isNew,t])=>{
    const r = document.createElement('div');
    r.className = 'row' + (isNew ? ' new' : '') + (sel.has(n) ? ' sel' : '');
    r.dataset.n = n; r.dataset.new = isNew;
    const w = WARN[n];
    if(w) r.dataset.w = w[0];
    r.innerHTML = `<div class="n">${n}</div><div class="t">${t}` +
      (w ? `<small class="w ${w[0]}"><b>${WLAB[w[0]]}</b> — ${w[1]}</small>` : '') +
      `</div>`;
    r.onclick = ()=>{
      if(sel.has(n)){sel.delete(n); r.classList.remove('sel');}
      else {sel.add(n); r.classList.add('sel');}
      refresh();
    };
    s.appendChild(r);
  });
  app.appendChild(s);
});

let filter = 'all';
function refresh(){
  document.getElementById('c').textContent = sel.size;
  document.querySelectorAll('.row').forEach(r=>{
    const isNew = r.dataset.new === '1';
    const isSel = sel.has(+r.dataset.n);
    let show = true;
    if(filter==='new') show = isNew;
    if(filter==='old') show = !isNew;
    if(filter==='sel') show = isSel;
    if(filter==='warn') show = !!r.dataset.w;
    r.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('section').forEach(s=>{
    const any = [...s.querySelectorAll('.row')].some(r=>r.style.display!=='none');
    s.style.display = any ? '' : 'none';
  });
}
document.querySelectorAll('.f').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); filter = b.dataset.f; refresh();
  };
});
document.getElementById('clear').onclick = ()=>{
  sel.clear();
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('sel'));
  document.getElementById('outbox').classList.add('hid');
  refresh();
};
document.getElementById('copy').onclick = ()=>{
  const nums = [...sel].sort((a,b)=>a-b).join(', ');
  const txt = nums ? 'Voglio fare queste: ' + nums : 'Non hai scelto niente.';
  const box = document.getElementById('outbox');
  document.getElementById('out').value = txt;
  box.classList.remove('hid');
  try{ navigator.clipboard.writeText(txt); }catch(e){}
  document.getElementById('out').scrollIntoView({behavior:'smooth', block:'center'});
};
refresh();
